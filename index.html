  <!-- Google Translate Initialization -->
  <script>
    (function () {
      var savedLang = localStorage.getItem('userLanguage') || 'en';
      function clearCookies() {
        var h = window.location.hostname;
        var parts = h.split('.');
        var rootD = parts.length >= 2 ? parts.slice(-2).join('.') : h;
        var domains = ['', '.' + h, h, '.' + rootD, rootD];
        domains.forEach(function (d) {
          var dStr = d ? '; domain=' + d : '';
          document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/' + dStr;
        });
      }

      if (savedLang === 'en') {
        clearCookies();
      }

      window.googleTranslateElementInit = function () {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      };

      window.loadGoogleTranslateScript = function (callback) {
        if (window.google && window.google.translate) {
          if (callback) callback();
          return;
        }
        var existing = document.getElementById('google-translate-script');
        if (existing) {
          existing.addEventListener('load', function () { if (callback) callback(); });
          return;
        }
        var s = document.createElement('script');
        s.id = 'google-translate-script';
        s.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        s.async = true;
        s.onload = function () { if (callback) callback(); };
        document.body.appendChild(s);
      };
    })();
  </script>
</head>

<body>
  <div id="google_translate_element" style="display:none"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
